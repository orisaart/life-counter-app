name: Build Android APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: PWABuilder/pwa-github-actions-demo@v1
        with:
          packageId: com.orisaart.lifecounter
          host: https://orisaart.github.io
          appVersion: 1.0.0
          signingKeyAlias: my-key-alias
